<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        /* General Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e9ecef;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* Main Wrapper to simulate the screen bounds */
        .page-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Header Styles */
        header {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1520763185298-1b434c919102?w=800&auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 {
            background-color: #003399;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: normal;
        }

        /* Navigation Styles */
        nav {
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            border-top: 1px solid #ddd;
        }

        nav ul {
            list-style-type: none;
            display: flex;
        }

        nav ul li {
            border-right: 1px solid #ddd;
        }

        nav ul li a {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            color: #d32f2f;
            font-size: 14px;
            text-transform: uppercase;
        }

        nav ul li a:hover {
            background-color: #e2e6ea;
        }

        /* Main Content Layout */
        .main-container {
            display: flex;
            min-height: 400px;
        }

        /* Left Sidebar */
        .sidebar {
            width: 30%;
            padding: 20px;
            border-right: 1px solid #ddd;
            background-color: #fafafa;
        }

        .sidebar h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .sidebar p {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }

        /* Right Content Area */
        .content {
            width: 70%;
            padding: 20px;
        }

        .content h2 {
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 5px;
        }

        .date-text {
            font-size: 12px;
            color: #003399;
            margin-bottom: 15px;
        }

        .profile-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .profile-image {
            width: 80px;
            height: 80px;
            border: 1px solid #ccc;
            object-fit: cover;
        }

        .welcome-text {
            font-size: 13px;
            line-height: 1.5;
            flex: 1;
        }

        .content h3 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .calc-text {
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* Button Style */
        .btn-calc {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-calc:hover {
            background-color: #0056b3;
        }

        /* Footer Styles */
        footer {
            background-color: #003399;
            color: #ffffff;
            padding: 15px;
            text-align: left;
            font-size: 12px;
        }

        /* Modal Calculator Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .calculator-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 300px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: #000;
        }

        .calculator-card h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .calculator-screen {
            width: 100%;
            height: 50px;
            background-color: #1e293b;
            color: #ffffff;
            font-size: 1.5rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calculator-keys button {
            padding: 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #e2e8f0;
            transition: background-color 0.2s;
        }

        .calculator-keys button:hover {
            background-color: #cbd5e1;
        }

        .btn-operator {
            background-color: #e0e7ff;
            color: #003399;
            font-weight: bold;
        }

        .btn-equals {
            background-color: #007bff;
            color: white;
            grid-column: span 2;
        }

        .btn-equals:hover {
            background-color: #0056b3;
        }

        .btn-clear {
            background-color: #fee2e2;
            color: #dc2626;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar, .content {
                width: 100%;
                border-right: none;
            }
            .sidebar {
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header Section -->
        <header>
            <h1>My Personal Website</h1>
        </header>

        <!-- Navigation Bar (Contacts removed) -->
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">PROFILE</a></li>
            </ul>
        </nav>

        <!-- Main Content Section -->
        <div class="main-container">
            
            <!-- Left Sidebar -->
            <div class="sidebar">
                <h3>Menu Content</h3>
                <p>Navigation and updates will go here.</p>
            </div>

            <!-- Right Content -->
            <div class="content">
                <h2>Welcome</h2>
                
                <div class="profile-section">
                    <img src="https://github.com/marcjoshuaa1104-eng/Antonio-Marc-Joshua-S.-/blob/main/Screenshot_2026-08-09-16-32-22-675_com.facebook.katana-edit.jpg" alt="Profile Picture" class="profile-image">
                    <p class="welcome-text">Welcome to my personal website! This website is still in the process of design and development.</p>
                </div>

                <h3>Laboratory Activity #1</h3>
                <p class="calc-text">Simple Calculator.</p>
                
                <button class="btn-calc" onclick="openCalculator()">Open Calculator</button>
            </div>

        </div>

        <!-- Footer -->
        <footer>
            © 2026 Marc Joshua S. Antonio
        </footer>
    </div>

    <!-- Usable Calculator Modal Popup -->
    <div id="calculatorModal" class="modal-overlay">
        <div class="calculator-card">
            <span class="close-modal" onclick="closeCalculator()">&times;</span>
            <h3>Simple Calculator</h3>
            <div id="screen" class="calculator-screen">0</div>
            <div class="calculator-keys">
                <button class="btn-clear" onclick="clearScreen()">C</button>
                <button class="btn-operator" onclick="appendValue('/')">/</button>
                <button class="btn-operator" onclick="appendValue('*')">*</button>
                <button class="btn-operator" onclick="appendValue('-')">-</button>
                
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="btn-operator" onclick="appendValue('+')">+</button>
                
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('.')">.</button>
                
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button onclick="appendValue('0')">0</button>
                
                <button class="btn-equals" onclick="calculateResult()">=</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('calculatorModal');
        const screen = document.getElementById('screen');
        let currentInput = '0';

        function openCalculator() {
            modal.style.display = 'flex';
        }

        function closeCalculator() {
            modal.style.display = 'none';
        }

        // Close modal when clicking outside the calculator box
        window.onclick = function(event) {
            if (event.target == modal) {
                closeCalculator();
            }
        }

        function appendValue(value) {
            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            updateScreen();
        }

        function clearScreen() {
            currentInput = '0';
            updateScreen();
        }

        function calculateResult() {
            try {
                currentInput = String(Function('"use strict";return (' + currentInput + ')')());
            } catch (error) {
                currentInput = 'Error';
            }
            updateScreen();
        }

        function updateScreen() {
            screen.textContent = currentInput;
        }
    </script>

</body>
</html>
